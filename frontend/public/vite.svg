<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="ccBgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="50%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#c2410c" />
    </linearGradient>
    <filter id="ccShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.2" />
    </filter>
  </defs>

  <!-- Orange Squircle Box -->
  <rect width="512" height="512" rx="140" fill="url(#ccBgGradient)" filter="url(#ccShadow)" />

  <!-- Inner Soft Border Accent -->
  <rect x="12" y="12" width="488" height="488" rx="128" fill="none" stroke="#ffffff" stroke-width="12" stroke-opacity="0.25" />

  <!-- Bold White 'cc' Text Logo -->
  <text
    x="256"
    y="340"
    font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
    font-size="290"
    font-weight="900"
    fill="#ffffff"
    text-anchor="middle"
    letter-spacing="-14"
  >cc</text>
</svg>
